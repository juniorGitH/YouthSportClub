name: Build and deploy .NET backend to Azure Web App

# Déploiement manuel (le tenant étudiant bloque souvent la création de SP pour AZURE_CREDENTIALS).
# Alternative locale : az acr build + az webapp restart (voir scripts/deploy-azure.ps1).
on:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: youthsportsclub-api
  AZURE_RESOURCE_GROUP: rg-youthsportsclub
  ACR_NAME: ysctogoacr
  IMAGE_NAME: ysc-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image in ACR and restart Web App
        run: |
          az acr build \
            -r "${{ env.ACR_NAME }}" \
            -g "${{ env.AZURE_RESOURCE_GROUP }}" \
            -t "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            -f backend/Ysc.Api/Dockerfile \
            backend/Ysc.Api

          az webapp config container set \
            -g "${{ env.AZURE_RESOURCE_GROUP }}" \
            -n "${{ env.AZURE_WEBAPP_NAME }}" \
            --container-image-name "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest" \
            --container-registry-url "https://${{ env.ACR_NAME }}.azurecr.io"

          az webapp restart \
            -g "${{ env.AZURE_RESOURCE_GROUP }}" \
            -n "${{ env.AZURE_WEBAPP_NAME }}"
